<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab - Manya Gureja</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #fff;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo::before {
            content: '●';
            color: #00ff00;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        nav a:hover,
        nav a.active {
            color: #00ff00;
        }

        .time {
            font-size: 14px;
            font-weight: bold;
        }

        .lab-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 120px 40px 60px;
        }

        .experiments-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 100%;
        }

        .experiment-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .experiment-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 255, 0, 0.3);
            transform: translateY(-2px);
        }

        .experiment-card:focus-visible {
            outline: 1px solid rgba(0, 255, 0, 0.45);
            outline-offset: 2px;
        }

        .card-media {
            width: 100%;
            aspect-ratio: 16/9;
            background: #111;
            overflow: hidden;
            position: relative;
        }

        .media-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .media-placeholder img,
        .media-placeholder video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            padding: 20px;
        }

        .card-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #fff;
        }

        .card-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .dialog-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .dialog-overlay.active {
            display: flex;
            opacity: 1;
            animation: slideUp 0.3s ease forwards;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .dialog-content {
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }

        .dialog-overlay.active .dialog-content {
            transform: translateY(0);
        }

        .dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
        }

        .dialog-title {
            font-size: 20px;
            font-weight: bold;
            color: #fff;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.3s;
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

        .close-btn:hover {
            color: #00ff00;
            background: rgba(255, 255, 255, 0.05);
        }

        .dialog-body {
            flex: 1;
            overflow-y: auto;
            padding: 40px;
        }

        .dialog-media-container {
            max-width: 1200px;
            margin: 0 auto 40px;
        }

        .dialog-media-container img,
        .dialog-media-container video {
            display: block;
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 8px 32px rgba(0, 255, 0, 0.1);
        }

        .dialog-info {
            max-width: 1200px;
            margin: 0 auto;
        }

        .dialog-info h2 {
            font-size: 24px;
            margin-bottom: 16px;
            color: #00ff00;
        }

        .dialog-info p {
            font-size: 14px;
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 12px;
        }

        .dialog-meta {
            display: flex;
            gap: 40px;
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .meta-label {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meta-value {
            font-size: 14px;
            color: #fff;
        }

        @media (max-width: 768px) {
            .experiments-grid {
                grid-template-columns: 1fr;
            }

            .lab-container {
                padding: 100px 20px 40px;
            }

            header {
                padding: 15px 20px;
            }

            nav {
                gap: 15px;
            }

            .dialog-header {
                padding: 15px 20px;
            }

            .dialog-body {
                padding: 20px;
            }

            .dialog-meta {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>

        class LabPage {
            constructor() {
                this.projects = LAB_PROJECTS;
                this.projectMap = new Map(this.projects.map(project => [project.id, project]));
                this.grid = document.getElementById('experimentsGrid');
                this.overlay = document.getElementById('dialogOverlay');
                this.dialogTitle = document.getElementById('dialogTitle');
                this.dialogDescription = document.getElementById('dialogDescription');
                this.dialogDate = document.getElementById('dialogDate');
                this.dialogCategory = document.getElementById('dialogCategory');
                this.dialogTools = document.getElementById('dialogTools');
                this.dialogLink = document.getElementById('dialogLink');
                this.dialogMediaContainer = document.getElementById('dialogMediaContainer');
                this.closeDialogButton = document.getElementById('closeDialogButton');
                this.timeElement = document.getElementById('time');
                this.videoObserver = null;
                this.pendingPreviewHandlers = new WeakMap();
                this.canHoverPreview = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
                this.timeInterval = null;
            }

            init() {
                this.renderProjects();
                this.bindEvents();
                this.setupVideoObserver();
                this.startClock();
            }

            renderProjects() {
                this.grid.textContent = '';
                const fragment = document.createDocumentFragment();

                this.projects.forEach(project => {
                    const card = document.createElement('article');
                    card.className = 'experiment-card';
                    card.dataset.experiment = project.id;
                    card.tabIndex = 0;
                    card.setAttribute('role', 'button');
                    card.setAttribute('aria-label', `Open ${project.title}`);

                    const media = document.createElement('div');
                    media.className = 'card-media';

                    const placeholder = document.createElement('div');
                    placeholder.className = 'media-placeholder';

                    if (project.media.type === 'video') {
                        const video = document.createElement('video');
                        video.muted = true;
                        video.loop = true;
                        video.playsInline = true;
                        video.preload = 'none';
                        video.dataset.src = project.media.src;
                        if (project.media.poster) {
                            video.poster = project.media.poster;
                        }
                        placeholder.appendChild(video);
                    } else {
                        const image = document.createElement('img');
                        image.src = project.media.src;
                        image.alt = project.media.alt || project.title;
                        image.loading = 'lazy';
                        image.decoding = 'async';
                        placeholder.appendChild(image);
                    }

                    media.appendChild(placeholder);

                    const info = document.createElement('div');
                    info.className = 'card-info';

                    const title = document.createElement('div');
                    title.className = 'card-title';
                    title.textContent = project.title;

                    const date = document.createElement('div');
                    date.className = 'card-date';
                    date.textContent = project.date;

                    info.append(title, date);
                    card.append(media, info);
                    fragment.appendChild(card);
                });

                this.grid.appendChild(fragment);
            }

            bindEvents() {
                const cards = this.grid.querySelectorAll('.experiment-card');

                cards.forEach(card => {
                    card.addEventListener('click', () => this.openDialog(card.dataset.experiment));
                    card.addEventListener('keydown', event => {
                        if (event.key === 'Enter' || event.key === ' ') {
                            event.preventDefault();
                            this.openDialog(card.dataset.experiment);
                        }
                    });

                    if (!this.canHoverPreview) {
                        return;
                    }

                    const video = card.querySelector('video');
                    if (!video) {
                        return;
                    }

                    card.addEventListener('mouseenter', () => this.startPreview(video));
                    card.addEventListener('mouseleave', () => this.stopPreview(video, true));
                });

                this.closeDialogButton.addEventListener('click', () => this.closeDialog());

                this.overlay.addEventListener('click', event => {
                    if (event.target === this.overlay) {
                        this.closeDialog();
                    }
                });

                document.addEventListener('keydown', event => {
                    if (event.key === 'Escape') {
                        this.closeDialog();
                    }
                });

                document.addEventListener('visibilitychange', () => {
                    if (document.hidden) {
                        this.pauseAllPreviews(false);
                        this.pauseDialogMedia();
                    }
                });

                window.addEventListener('pagehide', () => {
                    this.pauseAllPreviews(false);
                    this.pauseDialogMedia();
                });
            }

            setupVideoObserver() {
                if (!('IntersectionObserver' in window)) {
                    return;
                }

                this.videoObserver = new IntersectionObserver(entries => {
                    entries.forEach(entry => {
                        const video = entry.target;

                        if (entry.isIntersecting) {
                            this.loadPreviewVideo(video);
                            return;
                        }

                        this.stopPreview(video, false);
                    });
                }, {
                    rootMargin: '200px 0px'
                });

                this.grid.querySelectorAll('video[data-src]').forEach(video => {
                    this.videoObserver.observe(video);
                });
            }

            loadPreviewVideo(video) {
                if (!video || video.dataset.loaded === 'true') {
                    return;
                }

                video.src = video.dataset.src;
                video.preload = 'metadata';
                video.load();
                video.dataset.loaded = 'true';

                if (this.videoObserver) {
                    this.videoObserver.unobserve(video);
                }
            }

            startPreview(video) {
                if (!video || document.hidden || this.overlay.classList.contains('active')) {
                    return;
                }

                video.dataset.hovered = 'true';
                this.loadPreviewVideo(video);

                if (video.readyState >= 2) {
                    this.safePlay(video);
                    return;
                }

                const existingHandler = this.pendingPreviewHandlers.get(video);
                if (existingHandler) {
                    video.removeEventListener('canplay', existingHandler);
                }

                const handler = () => {
                    this.pendingPreviewHandlers.delete(video);
                    if (video.dataset.hovered === 'true' && !document.hidden && !this.overlay.classList.contains('active')) {
                        this.safePlay(video);
                    }
                };

                this.pendingPreviewHandlers.set(video, handler);
                video.addEventListener('canplay', handler, { once: true });
            }

            stopPreview(video, resetTime) {
                if (!video) {
                    return;
                }

                video.dataset.hovered = 'false';

                const pendingHandler = this.pendingPreviewHandlers.get(video);
                if (pendingHandler) {
                    video.removeEventListener('canplay', pendingHandler);
                    this.pendingPreviewHandlers.delete(video);
                }

                video.pause();

                if (resetTime && video.readyState > 0) {
                    try {
                        video.currentTime = 0;
                    } catch (error) {
                        // Ignore currentTime errors for partially loaded media.
                    }
                }
            }

            pauseAllPreviews(resetTime) {
                this.grid.querySelectorAll('video').forEach(video => {
                    this.stopPreview(video, resetTime);
                });
            }

            openDialog(projectId) {
                const project = this.projectMap.get(projectId);
                if (!project) {
                    return;
                }

                this.pauseAllPreviews(false);
                this.dialogTitle.textContent = project.title;
                this.dialogDate.textContent = project.date;
                this.dialogCategory.textContent = project.category;
                this.dialogTools.textContent = project.tools;
                this.dialogDescription.textContent = project.description;
                this.renderDialogLink(project);
                this.renderDialogMedia(project);

                this.overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            renderDialogLink(project) {
                this.dialogLink.textContent = '';

                if (!project.link) {
                    this.dialogLink.textContent = '—';
                    return;
                }

                const anchor = document.createElement('a');
                anchor.href = project.link;
                anchor.target = '_blank';
                anchor.rel = 'noopener noreferrer';
                anchor.style.color = '#00ff00';
                anchor.style.textDecoration = 'underline';
                anchor.textContent = project.linkLabel || 'Open link';
                this.dialogLink.appendChild(anchor);
            }

            renderDialogMedia(project) {
                this.pauseDialogMedia();
                this.dialogMediaContainer.textContent = '';

                if (project.media.type === 'video') {
                    const video = document.createElement('video');
                    video.controls = true;
                    video.preload = 'metadata';
                    video.playsInline = true;
                    if (project.media.poster) {
                        video.poster = project.media.poster;
                    }
                    video.src = project.media.src;
                    this.dialogMediaContainer.appendChild(video);
                    return;
                }

                const image = document.createElement('img');
                image.src = project.media.src;
                image.alt = project.media.alt || project.title;
                image.loading = 'eager';
                image.decoding = 'async';
                this.dialogMediaContainer.appendChild(image);
            }

            pauseDialogMedia() {
                const dialogVideo = this.dialogMediaContainer.querySelector('video');
                if (!dialogVideo) {
                    return;
                }

                dialogVideo.pause();
                dialogVideo.removeAttribute('src');
                dialogVideo.load();
            }

            closeDialog() {
                if (!this.overlay.classList.contains('active')) {
                    return;
                }

                this.overlay.classList.remove('active');
                document.body.style.overflow = '';
                this.pauseDialogMedia();
                this.dialogMediaContainer.textContent = '';
            }

            safePlay(video) {
                const playPromise = video.play();
                if (playPromise && typeof playPromise.catch === 'function') {
                    playPromise.catch(() => {});
                }
            }

            startClock() {
                const updateTime = () => {
                    const now = new Date();
                    const time = [now.getHours(), now.getMinutes(), now.getSeconds()]
                        .map(value => String(value).padStart(2, '0'))
                        .join(':');

                    this.timeElement.textContent = `${time} [VIE]`;
                };

                updateTime();
                this.timeInterval = window.setInterval(updateTime, 1000);
            }
        }

        new LabPage().init();
    </script>
</body>
</html>
